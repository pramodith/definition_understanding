[project]
name = "definition-understanding"
version = "0.1.0"
description = "A project to evaluate how well LLMs understand word definitions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "nltk",
    "litellm==1.67.1",
    "jupyter",
    "pytest",
    "tqdm",
    "hf_transfer",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "flake8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
